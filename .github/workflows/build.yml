name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Attaching the installer to a release is a write, and the default token is read only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/LoopIt7/LoopIt7.csproj -c Release --nologo

      - name: Publish
        run: dotnet publish src/LoopIt7/LoopIt7.csproj -c Release -r win-x64 --self-contained false -o publish --nologo

      # The icon and the installer artwork are drawn from geometry rather than committed
      # as binaries, so the build has to draw them before Inno Setup can pick them up.
      - name: Draw artwork
        run: powershell -ExecutionPolicy Bypass -File build/make-assets.ps1

      # Signs only when the repository has a certificate in its secrets. Without one the
      # step still runs and still succeeds; the download is simply unsigned, which is what
      # it has always been.
      - name: Sign the app
        env:
          LOOPIT7_CERT_BASE64: ${{ secrets.LOOPIT7_CERT_BASE64 }}
          LOOPIT7_CERT_PASSWORD: ${{ secrets.LOOPIT7_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File build/sign.ps1 -Path publish/LoopIt7.exe

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName /Qp installer/LoopIt7.iss
        shell: pwsh

      - name: Sign the installer
        env:
          LOOPIT7_CERT_BASE64: ${{ secrets.LOOPIT7_CERT_BASE64 }}
          LOOPIT7_CERT_PASSWORD: ${{ secrets.LOOPIT7_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File build/sign.ps1 -Path dist/LoopIt7-Setup.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: LoopIt7-Setup
          path: dist/*.exe

      # The self test opens no device and plays nothing. It runs the virtual output on its
      # own clock for two seconds and checks what comes out, which is the one part of the
      # engine that has no hardware to lean on.
      - name: Self test
        run: |
          & publish/LoopIt7.exe --self-test
          Start-Sleep -Seconds 12
          $report = Get-Content "$env:APPDATA/LoopIt7/self-test.txt" -Raw
          Write-Output $report
          if ($report -notmatch 'keeps time and passes signal') { throw 'The virtual output check did not pass.' }
        shell: pwsh

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
